<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060D1A" id="theme-color-meta" />
    <meta name="description" content="Raksha Computers, Derebail, Mangaluru. Computers, laptops and accessories. Call or WhatsApp to enquire." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600;800&display=swap" rel="stylesheet" />
    <title>Raksha Computers | Derebail, Mangaluru</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rc-theme');
          var pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var theme = (saved === 'light' || saved === 'dark') ? saved : pref;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
